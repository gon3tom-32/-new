<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twelve</title>
  <meta name="description" content="Gift exchange and 12 Days of Games for your family, friends, or team.">
  <meta name="theme-color" content="#E8173A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Twelve">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
  <script>
    // The app's version. Bump it whenever anything in twelve/ changes.
    // Every app file loads with ?v=<version>, so after an update a phone can
    // never mix new files with old cached ones. sw.js gets it from here too.
    window.TWELVE_VERSION = "11";

    (function (v) {
      // Every JavaScript module the app imports (paths inside js/). A file
      // missing from this list still works; it just isn't refreshed by
      // version bumps.
      var modules = [
        "config.js",
        "games/bingo.js",
        "games/day.js",
        "games/photo.js",
        "games/quiz.js",
        "games/scavenger.js",
        "games/speedmatch.js",
        "games/wyr.js",
        "lib/db.js",
        "lib/formats.js",
        "lib/push.js",
        "lib/questionnaire.js",
        "lib/state.js",
        "lib/ui.js",
        "screens/account.js",
        "screens/chat.js",
        "screens/gifts.js",
        "screens/home.js",
        "screens/leaderboard.js",
        "screens/onboarding.js",
        "screens/settings.js",
        "vendor/preact-htm.mjs"
      ];
      var imports = {};
      modules.forEach(function (f) { imports["./js/" + f] = "./js/" + f + "?v=" + v; });
      var map = document.createElement("script");
      map.type = "importmap";
      map.textContent = JSON.stringify({ imports: imports });
      document.head.appendChild(map);

      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "css/app.css?v=" + v;
      document.head.appendChild(css);
    })(window.TWELVE_VERSION);
  </script>
</head>
<body>
  <div id="app">
    <div class="boot"><div class="boot-mark">Twelve</div></div>
  </div>
  <noscript>Twelve needs JavaScript turned on.</noscript>
  <script src="js/vendor/supabase.js"></script>
  <script>
    var app = document.createElement("script");
    app.type = "module";
    app.src = "js/app.js?v=" + window.TWELVE_VERSION;
    document.body.appendChild(app);
  </script>
</body>
</html>
