<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Changer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f5;
      color: #222;
      transition: background-color 0.4s ease;
    }

    main {
      max-width: 560px;
      padding: 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      line-height: 1.6;
      margin-bottom: 24px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: #3b5bdb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2f4ac0;
    }

    .status {
      margin: 24px 0 0;
      font-size: 0.875rem;
      color: #555;
    }

    .status.ok {
      color: #2b8a3e;
    }

    .status.error {
      color: #c92a2a;
    }

    button:focus-visible {
      outline: 3px solid #91a7ff;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>
      This is a simple one-page website built with plain HTML, CSS, and
      JavaScript. Click the button below to give the page a fresh background color.
    </p>
    <button id="color-button" type="button">Change Background</button>
    <p id="supabase-status" class="status" role="status">Connecting to Supabase…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    const colors = [
      "#ffd6a5",
      "#caffbf",
      "#9bf6ff",
      "#a0c4ff",
      "#bdb2ff",
      "#ffc6ff",
      "#fdffb6",
      "#ffadad"
    ];
    let currentIndex = -1;

    document.getElementById("color-button").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % colors.length;
      document.body.style.backgroundColor = colors[currentIndex];
    });

    // Supabase project settings. The publishable key is meant to be public;
    // never put the secret (service_role) key in this file.
    const SUPABASE_URL = "https://gvbhdzyrojokhmwqxpao.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Jle63C7e10oOHsU4ouaPNw_2Tv7txjh";

    const statusEl = document.getElementById("supabase-status");

    function showStatus(message, state) {
      statusEl.textContent = message;
      statusEl.className = "status " + state;
    }

    if (!window.supabase) {
      showStatus("Could not load the Supabase library.", "error");
    } else {
      // Shared client for future database and login features.
      window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      // Check that the project is reachable and accepts the key.
      fetch(SUPABASE_URL + "/auth/v1/health", {
        headers: { apikey: SUPABASE_PUBLISHABLE_KEY }
      })
        .then((response) => {
          if (response.ok) {
            showStatus("Connected to Supabase.", "ok");
          } else {
            showStatus("Supabase rejected the request (HTTP " + response.status + ").", "error");
          }
        })
        .catch(() => {
          showStatus("Could not reach Supabase.", "error");
        });
    }
  </script>
</body>
</html>
